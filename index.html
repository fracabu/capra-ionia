COME OTTENERE IL CODICE FISCALE GRECO (AFM) — PASSO PASSO

L'AFM (ΑΦΜ) è un codice di 9 cifre rilasciato gratuitamente dall'Agenzia delle entrate greca (AADE). È il PRIMO passo obbligatorio per comprare un terreno: senza AFM non puoi firmare il rogito, pagare l'imposta di trasferimento né registrare la proprietà.

PASSO 1 — PREPARA I DOCUMENTI
Cittadini UE: carta d'identità o passaporto in corso di validità. Utile avere anche il codice fiscale italiano. Cittadini non-UE: serve anche un rappresentante fiscale greco.

PASSO 2 — SCEGLI IL CANALE
A) Di persona: presso una DOY (ufficio delle imposte), es. la DOY di Argostoli.
B) Online da remoto: tramite la piattaforma MyAADE, con appuntamento in videochiamata.
C) Tramite avvocato: con procura (PoA) apostillata — tu non ti muovi dall'Italia.

PASSO 3 — COMPILA IL MODULO M1
È il modulo di attribuzione del codice. Se nomini un rappresentante fiscale si aggiunge il modulo M7.

PASSO 4 — APPUNTAMENTO
Presentati alla DOY o collegati in videochiamata con i documenti. La procedura dura pochi minuti.

PASSO 5 — RICEVI L'AFM
Il codice viene rilasciato subito o in pochi giorni. È gratuito.

PASSO 6 — ATTIVA TAXISNET
Richiedi le credenziali TAXISnet: ti serviranno per pagare l'imposta di trasferimento (FMA 3,09%) tramite myPROPERTY prima del rogito.

CHECKLIST FINALE
[ ] Documento d'identità valido
[ ] Modulo M1 (+ M7 se serve)
[ ] AFM ricevuto
[ ] Credenziali TAXISnet attive

Nota: guida informativa, non consulenza legale. Verifica sempre con un avvocato greco.`},{id:`permesso`,icon:`🏠`,title:`Permesso edilizio per casette prefabbricate`,sub:`La regola che nessuno ti dice prima di comprare il terreno.`,bullets:[`Perché il prefabbricato NON è esente da permesso`,`Entro piano vs fuori piano (4.000 m²)`,`Norme antisismiche di Cefalonia`],body:`GUIDA GRATUITA · CAPRA IONIA
PERMESSO EDILIZIO E CASETTE PREFABBRICATE IN GRECIA

LA REGOLA CHIAVE
Il termine "mobile home" non esiste nell'urbanistica greca. Se la casetta è collegata stabilmente al suolo, all'acqua o alla corrente, è una COSTRUZIONE a tutti gli effetti: serve un permesso edilizio come per una casa in muratura. Quindi il terreno DEVE essere edificabile.

ROULOTTE E CARAVAN
Una roulotte targata su ruote può stare temporaneamente su terreno privato (non in zone archeologiche, litorali, spiagge o foreste), ma NON può essere allacciata legalmente a corrente e acqua — nemmeno con fotovoltaico al posto della rete.

DENTRO IL PIANO (entos schediou / oikismou)
Il lotto ha un coefficiente di edificabilità (spesso 0,8, copertura 50% negli oikismoi). Il PD 194/2025 ha introdotto nuovi minimi negli insediamenti sotto i 2.000 abitanti (da 300 a 2.000 m² a seconda della zona).

FUORI DAL PIANO (ektos schediou)
Di norma servono ALMENO 4.000 m² con fronte su strada pubblica: si costruiscono circa 186 m² residenziali, copertura massima 10%. Nuovo Decreto Presidenziale atteso nel 2026: quadro in evoluzione.

CEFALONIA E IL TERREMOTO DEL 1953
L'isola applica tra le norme antisismiche più severe della Grecia. Ogni progetto prefabbricato va adattato da un ingegnere locale (norme NOK + KENAK) e spesso passa dalla commissione architettonica.

I 3 CONTROLLI PRIMA DELL'OFFERTA
1. Il lotto è entos schediou/oikismou? (chiedilo per iscritto)
2. Quanti m² sono realmente costruibili?
3. Il prefabbricato è autorizzabile su QUEL lotto?

Nota: guida informativa, non consulenza legale.`},{id:`costi`,icon:`💶`,title:`Costi e tasse d'acquisto, senza sorprese`,sub:`Quanto paghi davvero oltre il prezzo del terreno.`,bullets:[`FMA 3,09% e come si paga (myPROPERTY)`,`Notaio, catasto, avvocato: le percentuali`,`Esempio pratico su un terreno da 35.000 €`],body:`GUIDA GRATUITA · CAPRA IONIA
COSTI E TASSE PER COMPRARE UN TERRENO IN GRECIA

IMPOSTA DI TRASFERIMENTO (FMA): 3,09%
Si calcola sul prezzo o sul valore fiscale oggettivo (il maggiore) e si paga PRIMA del rogito tramite il sistema online myPROPERTY.

GLI ALTRI COSTI
· Notaio (obbligatorio): ~1–1,5% + diritti
· Registrazione al Catasto (Ktimatologio): ~0,5%
· Avvocato (consigliato): ~0,5–1,5%
· Ingegnere/topografo (consigliato): forfait variabile, ~800 €
· Agente immobiliare: ~2% + IVA 24% (da concordare)

ESEMPIO SU UN TERRENO DA 35.000 €
FMA: ~1.082 € · Notaio: ~350–525 € · Catasto: ~175 € · Avvocato: ~175–525 € + ingegnere e agente.
Budget accessori realistico: 3.000–4.000 € (~8–10% del prezzo).

DOPO L'ACQUISTO
Ogni anno si pagano ENFIA (imposta sulla proprietà) e TAP (tassa comunale).

NOTA IVA
L'IVA 24% riguarda solo gli immobili nuovi (sospesa fino al 31/12/2026), NON i terreni: sui terreni si applica il 3,09%.

Nota: guida informativa, non consulenza legale.`},{id:`conto`,icon:`🏦`,title:`Aprire un conto in banca in Grecia`,sub:`Non serve per firmare, diventa indispensabile subito dopo.`,bullets:[`Quando serve davvero e quando no`,`I documenti che chiedono le banche`,`Come farlo senza andare in Grecia`],body:`GUIDA GRATUITA · CAPRA IONIA
APRIRE UN CONTO IN BANCA IN GRECIA

Per comprare un terreno il conto greco non è sempre obbligatorio: l'imposta di trasferimento si paga online tramite myPROPERTY e il saldo al rogito passa di norma per assegno circolare o bonifico. Diventa però difficile farne a meno dopo: ENFIA e TAP ogni anno, eventuali utenze, i pagamenti a ingegnere e avvocato. Conferma col notaio come vuole ricevere il saldo prima di decidere.

PRIMA DI TUTTO SERVE L'AFM
Il codice fiscale greco viene prima del conto: senza, nessuna banca apre. Se non ce l'hai ancora, parti dalla guida dedicata.

I DOCUMENTI CHE CHIEDONO
· Passaporto o carta d'identità UE in corso di validità
· AFM (il codice fiscale greco)
· Prova di indirizzo di residenza, di solito una bolletta recente
· Dichiarazione della residenza fiscale
· Prova di reddito o di attività: busta paga, dichiarazione dei redditi, visura

LE RICHIESTE CAMBIANO DA BANCA A BANCA
Non esiste una lista unica: ogni istituto applica le proprie regole antiriciclaggio, e alcune filiali chiedono anche permesso di soggiorno o documentazione aggiuntiva ai non residenti. Conviene sentire due o tre banche prima di scegliere, invece di dare per scontato che la prima rifiuti per tutte.

FARLO DA REMOTO
Anche qui vale la procura: puoi incaricare un avvocato o un commercialista greco di aprire il conto per tuo conto, con procura notarile apostillata. È la stessa procedura che serve per l'AFM e per il rogito, quindi conviene farne una sola che copra tutto.

DA CHIARIRE PRIMA
Chiedi in anticipo canone mensile, costo dei bonifici dall'Italia e se il conto viene declassato quando resta inattivo. Su un terreno da 30.000 €, cento euro l'anno di spese fisse non sono un dettaglio.

Nota: guida informativa, non consulenza legale. Le condizioni bancarie cambiano spesso: verifica sempre con la banca.`},{id:`procura`,icon:`✍️`,title:`Comprare da remoto con la procura`,sub:`Firmare il rogito senza mai salire su un aereo.`,bullets:[`Procura speciale, non generale`,`Notaio in Italia più apostille`,`Cosa deve contenere per essere valida`],body:`GUIDA GRATUITA · CAPRA IONIA
COMPRARE DA REMOTO CON LA PROCURA

Non serve essere in Grecia per comprare. Con una procura a un avvocato greco puoi delegare tutto: ottenere l'AFM, aprire il conto, firmare il rogito. È la strada che sceglie chi non può permettersi due o tre viaggi durante la trattativa.

SPECIALE, NON GENERALE
Esistono due tipi di procura. Quella generale copre ogni materia legale; quella speciale è limitata a un'operazione precisa. Per un acquisto è preferibile la speciale: definisce esattamente cosa il tuo incaricato può fare, e nulla di più.

I TRE PASSAGGI
A) Firma davanti a un notaio in Italia, sul testo predisposto dal tuo avvocato greco.
B) Apostille sul documento, secondo la Convenzione dell'Aia del 1961. In Italia la rilascia la Prefettura o la Procura, a seconda dell'atto.
C) Traduzione giurata in greco, da un traduttore riconosciuto dai tribunali greci.

In alternativa ai primi due passaggi puoi firmare direttamente davanti al consolato greco in Italia, che autentica senza bisogno di apostille.

COSA DEVE CONTENERE
La procura deve identificare il terreno in modo inequivocabile: ubicazione esatta, superficie, dati catastali. Deve elencare i poteri concessi e gli eventuali limiti, per esempio un prezzo massimo oltre il quale il tuo incaricato non può firmare. Una procura vaga viene contestata o rifiutata dal notaio greco.

METTICI TUTTO INSIEME
Visto che ogni procura costa notaio, apostille e traduzione, conviene farne una sola che copra AFM, conto corrente e rogito, invece di tre separate a distanza di settimane.

UN LIMITE DA CONOSCERE
Delegare la firma non significa delegare il giudizio. Il controllo dei titoli, dei confini e dei vincoli resta lavoro dell'avvocato e dell'ingegnere che scegli tu: la procura rende possibile non esserci, non ti dispensa dal capire cosa stai comprando.

Nota: guida informativa, non consulenza legale.`},{id:`allacci`,icon:`⚡`,title:`Luce e acqua sul terreno`,sub:`La regola che sorprende: senza permesso non c'è allaccio.`,bullets:[`Perché serve il permesso edilizio prima`,`Cosa chiede DEDDIE per la connessione`,`Il costo nascosto della distanza`],body:`GUIDA GRATUITA · CAPRA IONIA
LUCE E ACQUA SUL TERRENO

È la domanda che arriva sempre dopo il rogito, e la risposta spiazza: in Grecia l'allaccio elettrico non segue il terreno, segue la costruzione. Senza permesso edilizio non c'è fornitura domestica.

COSA CHIEDE DEDDIE
Il gestore della rete di distribuzione chiede, per una nuova connessione, la domanda di allaccio, copia del permesso edilizio, il diagramma topografico approvato e le planimetrie. Serve inoltre la verifica di connessione emessa tramite il sistema e-Licenses del TEE, la Camera tecnica greca, da un ingegnere che devi incaricare tu.

QUINDI SU TERRENO NON EDIFICABILE
Non si allaccia, ed è il motivo per cui un lotto non edificabile a buon prezzo resta comunque un cattivo affare. È anche la ragione per cui una casetta prefabbricata collegata stabilmente a corrente e acqua viene trattata come costruzione a tutti gli effetti.

LA FORNITURA AGRICOLA È UN'ALTRA COSA
Esiste una categoria separata per usi agricoli, che richiede una relazione tecnico-economica del servizio agricolo dell'unità regionale competente. Serve a irrigare o alimentare un'attività agricola, non a vivere sul posto: non è una scorciatoia per abitare un terreno non edificabile.

L'ACQUA DIPENDE DAL COMUNE
Non c'è una regola nazionale unica: la gestione idrica è comunale, e condizioni e tempi cambiano da un comune all'altro. A Cefalonia va verificato caso per caso, soprattutto fuori dagli insediamenti.

IL COSTO CHE NESSUNO TI DICE
Il preventivo di allaccio dipende dalla distanza dalla rete esistente. Un terreno panoramico lontano dai pali della luce può costare in allacci quanto una parte del terreno stesso. Prima di firmare, guarda dove passa la linea più vicina e fatti fare una stima.

Nota: guida informativa, non consulenza legale. Procedure e requisiti vanno confermati con un ingegnere greco.`},{id:`societa`,icon:`🏢`,title:`Comprare tramite società`,sub:`Spesso non conviene, e c'è un'imposta del 15% da conoscere.`,bullets:[`Nessuno sconto ENFIA per le società`,`L'imposta speciale del 15% annuo`,`Quando ha senso e quando no`],body:`GUIDA GRATUITA · CAPRA IONIA
COMPRARE TRAMITE SOCIETÀ

Prima o poi qualcuno te lo suggerisce. Per un terreno da 30.000 o 40.000 € che non produce reddito, quasi mai è una buona idea: i costi di gestione societaria sono certi, i vantaggi no.

NESSUNO SCONTO SULL'ENFIA
Le società pagano l'imposta annuale sulla proprietà con le stesse aliquote delle persone fisiche. Non c'è alcuna esenzione legata alla forma societaria: chi te la presenta come un risparmio fiscale sull'ENFIA sta dicendo una cosa falsa.

L'IMPOSTA SPECIALE DEL 15%
È il punto che va conosciuto prima di ogni altro. La Grecia applica un'imposta annuale del 15% sul valore dell'immobile alle strutture societarie che non rendono trasparente la propria compagine.

Sono esenti le società che dichiarano i soci, a condizione che siano persone fisiche dotate di AFM greco e che l'entità sia registrata in Grecia o in un altro Stato dell'Unione europea. Le società registrate fuori dall'UE possono ottenere l'esenzione solo se la loro giurisdizione non rientra fra quelle considerate non cooperative dalla legge fiscale greca.

La dichiarazione va presentata ogni anno entro il 20 maggio. Non è una formalità: su un immobile da 500.000 € una sola dichiarazione dimenticata vale 75.000 € di imposta.

QUANDO PUÒ AVERE SENSO
Il vantaggio reale riguarda i redditi da locazione: l'aliquota societaria si attesta al 22%, contro un massimo del 45% per le persone fisiche. Ma i dividendi scontano poi una ritenuta all'uscita, quindi il confronto va fatto sul netto finale, non sull'aliquota nominale.

IL CALCOLO ONESTO
Un terreno che non produce reddito non ha niente da tassare al 22%. Restano costi di costituzione, contabilità annuale, dichiarazioni e il rischio dell'imposta speciale se qualcosa nella struttura non è in regola. Prima di intraprendere questa strada, fatti fare due preventivi a confronto da un commercialista greco: acquisto come persona fisica e come società, su dieci anni.

Nota: guida informativa, non consulenza fiscale. La materia è tecnica e cambia: fatti assistere da un professionista greco.`}],vu=[[`Prepara i documenti`,`Carta d'identità o passaporto validi (cittadini UE). Se non-UE, serve anche un rappresentante fiscale greco.`],[`Scegli il canale`,`Di persona alla DOY di Argostoli · online via MyAADE in videochiamata · oppure tramite avvocato con procura apostillata, senza muoverti dall'Italia.`],[`Compila il modulo M1`,`È il modulo di attribuzione dell'AFM. Con rappresentante fiscale si aggiunge il modulo M7.`],[`Fai l'appuntamento`,`Alla DOY o in videochiamata: pochi minuti con i documenti alla mano.`],[`Ricevi l'AFM`,`9 cifre, gratuito, rilasciato subito o in pochi giorni dall'AADE.`],[`Attiva TAXISnet`,`Le credenziali ti servono per pagare l'imposta FMA 3,09% via myPROPERTY prima del rogito.`]],yu=[{id:1,loc:`Faraklata`,zone:`Argostoli · ~7 km`,price:23e3,sqm:166,status:`in`,note:`Entro oikismos`,src:`Enos Properties · ID 3035`,desc:`Faraklata guarda il golfo di Argostoli da circa 220 metri di quota, a 4 km dal capoluogo. È la comunità che comprende anche Prokopata, Razata e Drapano: campagna vicina alla città, con l'ospedale e il porto a pochi minuti.

**Attenzione alla superficie.** Il lotto è di 166 m². Il PD 194/2025 ha fissato per gli insediamenti sotto i 2.000 abitanti superfici minime edificabili che partono da 300 m²: questo terreno sta ben al di sotto. Può essere ugualmente edificabile solo se rientra in una deroga per lotti storici, cosa che va accertata prima di qualunque impegno.

È il terreno dal prezzo più basso dell'elenco, 23.000 €, e questo lo rende attraente a colpo d'occhio. Ma a 139 €/m² è **l'undicesimo su dodici** per convenienza: paghi poco perché è piccolo, non perché costi poco al metro.

Da verificare, in quest'ordine: se il lotto è edificabile alla luce delle nuove soglie; e in caso affermativo quanti metri quadri si possono davvero costruire, perché su 166 m² di terreno la risposta potrebbe essere "molto pochi".`},{id:2,loc:`Peratata`,zone:`Livathos · ~8 km`,price:25e3,sqm:100,status:`in`,note:`Entro oikismos`,src:`Enos Properties · ID 2903`,desc:`Peratata sta ai piedi del castello veneziano di Agios Georgios, nella zona del Livathos, a 8 km da Argostoli. Posizione riconoscibile e comoda, fra le più conosciute dell'isola.

**Cento metri quadri.** È la superficie di questo lotto, ed è il dato da cui partire: le soglie minime introdotte dal PD 194/2025 negli insediamenti minori partono da 300 m². Come per Faraklata, l'edificabilità dipenderebbe da una deroga per lotti preesistenti, da accertare con un ingegnere prima di ogni altra considerazione.

A 250 €/m² è **il terreno meno conveniente dell'intero elenco**, il dodicesimo su dodici. Per dare la misura: con 38.000 € a Epanochori compri 4.035 m², quaranta volte tanto, spendendo solo 13.000 € in più.

Lo teniamo in elenco perché è in vendita e perché il confronto è istruttivo, non perché lo consigliamo.`},{id:3,loc:`Chavriata`,zone:`Penisola di Paliki`,price:3e4,sqm:972,status:`in`,note:`Entro oikismos`,src:`Premium Kefalonia · 10311`,star:!0,desc:`Chavriata sta sulla penisola di Paliki, a 8 km da Lixouri, e la chiamano il «balcone dello Ionio»: dal paese si vedono insieme la piana coltivata e il mare. È un borgo storico — la chiesa di Panagia Chavriata è del Cinquecento — ricostruito dopo il terremoto del 1953 che rase al suolo buona parte dell'isola. Poco distanti ci sono il monastero di Kipoureon e le spiagge di Xi e Megas Lakkos, riconoscibili dalla sabbia rosso-arancio.

Il lotto è di 972 m² dentro l'oikismos, cioè entro il perimetro dell'insediamento. È la condizione più comoda per costruire: non si applicano i 4.000 m² minimi richiesti fuori dal piano, e negli oikismoi la copertura arriva di norma al 50%.

A 30,9 €/m² è il terreno **più conveniente di tutti quelli entro piano** del nostro elenco: gli unici tre che costano meno al metro quadro sono fuori piano, con i vincoli che ne derivano.

Da verificare prima di muoversi: il PD 194/2025 ha introdotto nuove superfici minime negli insediamenti sotto i 2.000 abitanti, da 300 a 2.000 m² secondo la zona. Con 972 m² il lotto rientra nella maggior parte dei casi, ma la soglia esatta dipende dalla zona urbanistica specifica e va confermata da un ingegnere greco sulla planimetria.`},{id:4,loc:`Kalligata`,zone:`Livathos`,price:3e4,sqm:1500,status:`no`,note:`NON edificabile — da scartare`,src:`Enos Properties · ID 2911`,desc:`Kalligata è un paese del Livathos a circa 96 metri di quota, nella fascia fertile che scende da Argostoli verso le spiagge del sud.

**Su questo terreno non si può costruire.** È la ragione per cui compare in elenco con l'avviso, invece di essere nascosto: 1.500 m² a 30.000 € fanno 20 €/m², che sarebbe il quarto miglior prezzo al metro di tutto il listino. Chi guarda solo quella cifra pensa di aver trovato l'affare.

Non lo è. Senza edificabilità non ottieni il permesso, e senza permesso **non ottieni nemmeno l'allaccio della corrente**: in Grecia la fornitura domestica segue la costruzione, non il terreno. Resta un appezzamento agricolo, con il valore di un appezzamento agricolo.

Lo pubblichiamo perché il €/m² da solo inganna, e questo è il caso che lo dimostra meglio.`},{id:5,loc:`Dorizata`,zone:`Livathos`,price:33e3,sqm:500,status:`in`,note:`Edificabile`,src:`Premium Kefalonia · 10150`,star:!0,desc:`Dorizata è una frazione minuscola del Livathos — una quarantina di residenti, 89 metri di quota — nella fascia che scende da Argostoli verso la costa sud. È la zona più abitata e servita dell'isola dopo il capoluogo: ci stanno l'aeroporto, all'altezza di Minies, e le spiagge di Ai Helis, Ammes, Avithos, Trapezaki e Lourdas, quasi tutte sabbiose e digradanti. Nel raggio di pochi chilometri ci sono paesi molto curati come Kourkoumelata, Metaxata e Svoronata.

Il lotto è di 500 m² ed è dichiarato edificabile. È il più piccolo dei tre terreni entro piano che consigliamo: adatto a una casa singola, non a un progetto con dépendance o piscina generosa.

A 66 €/m² è il terzo miglior prezzo al metro fra i terreni entro piano. Costa più di Chavriata e Prokopata, ma è anche l'unico dei tre in una zona con servizi, aeroporto e mare a portata di macchina tutto l'anno — se il terreno serve per starci e non solo per costruirci, quella differenza ha un senso.

Da verificare con attenzione: 500 m² sono vicini alla soglia bassa introdotta dal PD 194/2025 per gli insediamenti minori. Prima di firmare qualsiasi cosa, fatti confermare da un ingegnere che il lotto superi il minimo previsto per la sua zona specifica.`},{id:6,loc:`Prokopata`,zone:`Argostoli · Razata`,price:35e3,sqm:758,status:`in`,note:`Entro piano urbanistico`,src:`Premium Kefalonia · 10348`,star:!0,desc:`Prokopata è un pugno di case appena fuori Argostoli, a un centinaio di metri di quota, con meno di trenta residenti. È fra le aree abitate più antiche di Cefalonia: gli scavi nella zona hanno restituito reperti che risalgono al 4000 a.C. Fa comunità con Faraklata, Razata e Drapano; a Razata si trovano le mura ciclopiche di un'acropoli micenea, a 5 km dal capoluogo.

Il lotto è di 758 m² entro piano urbanistico. La posizione è la sua caratteristica forte: sei a pochi minuti da Argostoli — ospedale, porto, negozi, scuole aperti tutto l'anno — restando in campagna. Per chi pensa a una casa da abitare davvero, e non solo da usare tre settimane d'estate, conta più di una vista.

A 46,2 €/m² è il secondo miglior prezzo al metro fra i terreni entro piano, dietro solo a Chavriata, che però sta dall'altra parte del golfo.

Da verificare: la superficie minima edificabile applicabile alla zona dopo il PD 194/2025, e l'esatto tracciato del confine del piano urbanistico, che in queste frazioni passa a volte in mezzo ai lotti.`},{id:7,loc:`Ratzakli`,zone:`Sud · verso Skala`,price:35e3,sqm:2317,status:`out`,note:`Fuori piano · edificabile`,src:`Enos Properties · ID 2965`,desc:`Ratzakli è un borgo di poco più di cento abitanti a 104 metri di quota, nell'unità di Eleios-Pronnoi, a 2 km da Skala — la località balneare più frequentata del sud dell'isola.

**Un punto tecnico da chiarire con l'agenzia.** Il lotto è di 2.317 m² fuori dal piano urbanistico, ma la regola generale fuori piano chiede almeno 4.000 m² e 25 metri di fronte su strada pubblica. Un terreno di questa dimensione può essere edificabile solo attraverso una deroga per lotti che avevano acquisito il diritto prima di certe date, tipicamente sulla soglia dei 2.000 m².

Quelle deroghe esistono, ma lo Stato greco le sta progressivamente eliminando: comprare contando su una di esse comporta un rischio più alto della norma, e va valutato con un ingegnere che verifichi se il diritto è tuttora valido.

Detto questo, a 15,1 €/m² è il **terzo miglior prezzo al metro** dell'elenco, e la vicinanza a Skala è un fattore reale per chi pensa all'affitto estivo. Vale la verifica.`},{id:8,loc:`Epanoxori`,zone:`Valsamata`,price:38e3,sqm:4035,status:`out`,note:`Fuori piano · >4.000 m² → ~186 m² costruibili`,src:`Enos Properties · ID 3261`,star:!0,desc:`Epanochori è un paese di venticinque abitanti a 480 metri di quota, nell'unità di Omala, 10 km a est di Argostoli lungo la stradina che da Valsamata scende verso Vlachata. Siamo alle pendici del monte Ainos, nella valle di Omala: è la zona della Robola, il vitigno bianco che cresce solo qui, sulle terrazze calcaree del monte. Poco più in basso stanno il monastero di Agios Gerasimos, patrono dell'isola, e la cantina cooperativa a 410 metri.

Il lotto è di 4.035 m² fuori dal piano urbanistico, e quella cifra non è casuale: fuori piano servono almeno 4.000 m² con fronte su strada pubblica per poter costruire. Questo terreno supera il minimo di appena 35 m². La copertura massima è del 10% e l'edificabilità residenziale si aggira sui 186 m².

A 9,4 €/m² è **il terreno più conveniente di tutto l'elenco**, di misura su Vlichata: paghi 38.000 € una superficie quaranta volte più grande del lotto da 100 m² di Peratata, che ne costa 25.000. È il caso che spiega meglio di ogni altro perché il prezzo in vetrina inganna.

Due avvertenze serie. Primo: il margine sui 4.000 m² è sottilissimo, quindi il frazionamento catastale va verificato con un topografo prima di qualunque impegno — se la superficie reale scendesse sotto la soglia, il terreno non sarebbe edificabile. Secondo: è atteso un nuovo Decreto Presidenziale sull'edificabilità fuori piano, che potrebbe cambiare le regole.`},{id:9,loc:`Livathos`,zone:`Area Livathos`,price:39e3,sqm:442,status:`in`,note:`Entro piano`,src:`Premium Kefalonia · 10334`,desc:`L'annuncio indica genericamente "area Livathos", la fascia a sud di Argostoli che va dall'aeroporto di Minies fino alle spiagge di Ai Helis, Avithos e Trapezaki. È la zona più abitata e servita dell'isola dopo il capoluogo, con paesi molto curati come Kourkoumelata e Svoronata.

**Il paese preciso non è indicato**, ed è la prima cosa da chiedere: dentro il Livathos i prezzi cambiano parecchio fra un borgo interno e uno a due passi dal mare. Sulla mappa il segnaposto è collocato al centro dell'area, non su un punto reale.

Il lotto è di 442 m² entro piano, a 88 €/m²: il nono su dodici per convenienza. Sei in una zona comoda, ma stai pagando quella comodità.

Da verificare: la località esatta, la superficie minima edificabile applicabile a quella zona dopo il PD 194/2025, e quanti metri quadri si possono costruire.`},{id:10,loc:`Peratata`,zone:`Livathos`,price:4e4,sqm:420,status:`in`,note:`Entro piano · ~240 m² edificabili`,src:`Premium Kefalonia · 1075`,desc:`Il secondo lotto che seguiamo a Peratata, ai piedi del castello di Agios Georgios, nel Livathos. Qui la posizione è fra le più riconoscibili dell'isola e i servizi di Argostoli sono a otto chilometri.

420 m² entro piano, con circa 240 m² edificabili secondo l'agenzia: abbastanza per una casa singola con un po' di respiro attorno, non per un progetto ambizioso.

A 95 €/m² è il decimo su dodici per convenienza. Il confronto interno all'elenco è impietoso: l'altro lotto di Peratata costa 25.000 € per 100 m², questo 40.000 € per 420 m². Il secondo costa di più in assoluto ma **meno della metà al metro quadro**, ed è l'unico dei due che supera senza discussioni le soglie minime di edificabilità.

Da verificare: la conferma scritta dei 240 m² edificabili, e la distanza dalla rete elettrica.`},{id:11,loc:`Dorizata`,zone:`Livathos`,price:4e4,sqm:501,status:`in`,note:`Entro oikismos`,src:`Enos Properties · ID 3214`,desc:`Dorizata è una frazione di una quarantina di residenti nel Livathos, a 89 metri di quota, nella fascia che scende verso le spiagge del sud.

**Un confronto da fare prima di scrivere all'agenzia.** In elenco ci sono due terreni a Dorizata quasi identici: questo, 501 m² a 40.000 €, e un altro di 500 m² a 33.000 €. Un metro quadro di differenza, **settemila euro di differenza**. A parità di superficie e di paese, la spiegazione può stare nell'esposizione, nella pendenza, nella distanza dalla strada o dagli allacci — oppure semplicemente nel fatto che un venditore ha più fretta dell'altro.

Chiedi entrambi e fatteli spiegare. È il tipo di domanda che fa capire all'agenzia che non stai comprando alla cieca.

A 80 €/m² questo è il settimo su dodici; l'altro, a 66 €/m², è il sesto ed è fra i nostri consigliati.`},{id:12,loc:`Vlichata`,zone:`Vista mare · 2,5 km dal mare`,price:4e4,sqm:4e3,status:`out`,note:`Fuori oikismos · 6 lotti disponibili`,src:`Mesitiko Moisis / estateellas`,desc:`Vlachata Eikosimias sta nel Livathos, a un chilometro da Lourdata e circa 2,5 km dal mare, sul versante sud dell'isola. Da non confondere con l'altra Vlachata dell'isola, che si trova presso Sami: sono due paesi diversi a undici chilometri di distanza, ed è bene accertarsi con l'agenzia di quale si parla.

**Quattromila metri quadri esatti.** Fuori dal piano urbanistico la soglia per costruire è di 4.000 m² con almeno 25 metri di fronte su strada pubblica. Questo lotto è esattamente al limite: **margine zero**. Se il frazionamento catastale reale risultasse anche solo di pochi metri inferiore al dichiarato, il terreno non sarebbe edificabile.

È la verifica da fare per prima, con un topografo, prima di qualunque impegno. Vale anche la conferma del fronte stradale, che è un requisito autonomo e altrettanto vincolante.

Superata quella soglia, i numeri sono buoni: 10 €/m² è il **secondo miglior prezzo al metro** dell'elenco. L'annuncio segnala sei lotti disponibili nella stessa zona, quindi c'è margine per confrontarli fra loro.`},{id:13,loc:`Menegata`,zone:`Livathos`,price:45e3,sqm:538,status:`in`,note:`Entro piano · ~240 m² edificabili`,src:`Premium Kefalonia · 10490`,desc:`Menegata è una piccola frazione del Livathos, adiacente a Lakithra, nella zona meglio servita dell'isola dopo Argostoli: aeroporto, spiagge sabbiose e paesi curati nel raggio di pochi chilometri.

538 m² entro piano, con circa 240 m² edificabili secondo l'agenzia. È il terreno **più caro dell'elenco in valore assoluto**, 45.000 €, e a 84 €/m² sta all'ottavo posto su dodici per convenienza: paghi la zona, non la superficie.

Ha senso per chi vuole vivere a Cefalonia tutto l'anno e non solo passarci l'estate — servizi aperti d'inverno, aeroporto vicino, strade buone. Ha meno senso per chi cerca il massimo dei metri quadri per euro speso.

Da verificare: la conferma scritta dei 240 m² edificabili e la superficie minima applicabile alla zona dopo il PD 194/2025. La posizione del segnaposto sulla mappa è al momento una stima ancorata a Lakithra.`}],bu=yu.map(e=>e.price),xu=Math.min(...bu),Su=Math.max(...bu),Cu=(()=>{let e=[...bu].sort((e,t)=>e-t),t=e[Math.floor(e.length/2)];return Math.round(t/5e3)*5e3})(),wu=(()=>{let e=yu.filter(e=>e.status===`in`).map(e=>e.price);return{min:Math.min(...e),max:Math.max(...e)}})(),Tu=`0 0 64 64`,Eu=[{d:`M22 18 C18 10, 22 4, 28 6 M30 16 C28 10, 31 5, 36 6`,cap:`round`},{d:`M24 20 C20 22, 18 27, 20 31 L14 36 C11 38, 12 42, 16 42 L20 40 C22 46, 28 50, 35 49 L48 47 C54 46, 56 40, 53 35 C57 33, 57 27, 52 26 L36 24 C33 20, 28 18, 24 20 Z`,join:`round`},{d:`M28 49 L28 58 M40 48 L40 58 M46 47 L48 57`,cap:`round`},{d:`M17 42 L15 47`,cap:`round`}],Du={cx:22,cy:27,r:1.6},Ou=`M24 58 L52 58`,ku=`#D9A441`,Au=c(o(((e,t)=>{(function(n,r){typeof e==`object`&&t!==void 0?r(e):typeof define==`function`&&define.amd?define([`exports`],r):(n=typeof globalThis<`u`?globalThis:n||self,r(n.leaflet={}))})(e,(function(e){var t=`1.9.4`;function n(e){var t,n,r,i;for(n=1,r=arguments.length;n<r;n++)for(t in i=arguments[n],i)e[t]=i[t];return e}var r=Object.create||(function(){function e(){}return function(t){return e.prototype=t,new e}})();function i(e,t){var n=Array.prototype.slice;if(e.bind)return e.bind.apply(e,n.call(arguments,1));var r=n.call(arguments,2);return function(){return e.apply(t,r.length?r.concat(n.call(arguments)):arguments)}}var a=0;function o(e){return`_leaflet_id`in e||(e._leaflet_id=++a),e._leaflet_id}function s(e,t,n){var r,i,a,o=function(){r=!1,i&&=(a.apply(n,i),!1)};return a=function(){r?i=arguments:(e.apply(n,arguments),setTimeout(o,t),r=!0)},a}function c(e,t,n){var r=t[1],i=t[0],a=r-i;return e===r&&n?e:((e-i)%a+a)%a+i}function l(){return!1}function u(e,t){if(t===!1)return e;var n=10**(t===void 0?6:t);return Math.round(e*n)/n}function d(e){return e.trim?e.trim():e.replace(/^\s+
